name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Dummy env so the app can boot during typecheck/build (validation runs at import-time).
      DATABASE_URL: postgresql://user:pass@localhost:5432/db?schema=public
      JWT_SECRET: ci-only-jwt-secret-at-least-32-characters-long-xyz
      ENCRYPTION_KEY: aGVsbG8td29ybGQtdGhpcy1pcy0zMi1ieXRlcy1sb25n
      COOKIE_PREFIX: app
      NEXT_PUBLIC_COOKIE_PREFIX: app
      AUTH_FORGOT_TARGET_LATENCY_MS: '0'

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile=false

      - name: Prisma generate
        run: pnpm --filter frontend exec prisma generate

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # Fail the build on high/critical CVEs in production deps.
      # Dev-only advisories are tolerated (they don't ship to users).
      #
      # 3 advisories are explicitly ignored via package.json's
      # pnpm.auditConfig.ignoreGhsas (GHSA-f88m-g3jw-g9cj sharp/libvips,
      # GHSA-6g55-p6wh-862q + GHSA-r28c-9q8g-f849 postcss sourceMappingURL)
      # — both packages are next@16.2.12's own internal/bundled deps
      # (pnpm overrides can't reach a dependency a package declares for
      # itself), and neither is reachable in this app: sharp only runs via
      # next/image (never imported — images go through our own
      # authenticated proxy route, see CLAUDE.md), and the postcss findings
      # are build-time-only file-read issues against our own trusted build
      # input, not something a deployed-app visitor can trigger. Pinned to
      # 16.2.12 rather than the otherwise-CVE-clean 16.3.x line because
      # 16.3.1+ hits an unresolved Vercel platform bug (missing
      # .next/next-server.js.nft.json during Vercel's packaging step).
      - name: Audit (prod deps, high+ severity)
        run: pnpm audit --prod --audit-level=high
